plugins {
    id 'com.android.application'
}

android {
    namespace 'com.durgmitra.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.durgmitra.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'APP_START_URL', '"https://appassets.androidplatform.net/assets/app/index.html"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
